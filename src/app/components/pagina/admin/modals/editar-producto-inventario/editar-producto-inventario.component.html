<!--este modal sirve para agregar y para editar un producto, 
cuando se edita el padre le manda los valores iniciales y cuando se agrega arranca vacío, 
no lleva form porque se va guardando lo que se escribe en signals y se manda al dar clic en Aceptar, 
por eso solo el maxlength limita lo que se escribe y el min con el step solo mueven las flechitas del campo-->
<article class="modal-editar-producto">
    <div class="modal-editar-producto__encabezado">
        <h2 class="modal-editar-producto__titulo">Agregar / Editar Producto</h2>
        <button class="modal-editar-producto__cerrar" type="button" (click)="clickCerrar()">X</button>
    </div>

    <div class="modal-editar-producto__separador"></div>

    <div class="modal-editar-producto__producto">
        <div class="modal-editar-producto__imagen-contenedor">
            <div class="modal-editar-producto__imagen">
                <img [src]="imagenPreview()"><!--usamos [src] entre corchetes para que se muestre la vista previa de la imagen que se eligió-->
            </div>
            <!--el input de archivo va oculto con hidden y el label Nueva hace de botón porque está ligado con el for, 
            el accept limita los tipos de imagen que deja elegir el explorador y con (change) el componente recibe la imagen-->
            <label class="modal-editar-producto__badge" for="inputImagenEditar">Nueva</label>
            <input id="inputImagenEditar" type="file" accept="image/jpeg,image/png,image/webp" (change)="actualizarImagen($event)" hidden>
        </div>
        <div class="modal-editar-producto__datos">
            <div class="modal-editar-producto__campo">
                <label class="modal-editar-producto__etiqueta">Nombre:</label>
                <input class="modal-editar-producto__input" type="text" [value]="nombre()" placeholder="Escriba el nombre..." maxlength="80" (input)="actualizarNombre($event)">
            </div>
            <div class="modal-editar-producto__campo">
                <label class="modal-editar-producto__etiqueta">Descripción:</label>
                <input class="modal-editar-producto__input" type="text" [value]="descripcion()" placeholder="Descripción..." maxlength="300" (input)="actualizarDescripcion($event)">
            </div>
            <div class="modal-editar-producto__campo">
                <label class="modal-editar-producto__etiqueta">Precio Unitario:</label>
                <input class="modal-editar-producto__input" type="number" [value]="precioUnitario()" placeholder="$100" min="0.01" step="0.01" (input)="actualizarPrecioUnitario($event)">
            </div>
        </div>
    </div>

    <div class="modal-editar-producto__separador"></div>

    <div class="modal-editar-producto__acciones">
        <button class="modal-editar-producto__boton-cancelar" type="button" (click)="clickCancelar()">Cancelar</button>
        <button class="modal-editar-producto__boton-aceptar" type="button" (click)="clickAceptar()">Aceptar</button>
    </div>
</article>
