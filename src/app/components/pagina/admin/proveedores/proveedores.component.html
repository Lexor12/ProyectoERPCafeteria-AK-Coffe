<section class="proveedores">
    <div class="proveedores__toolbar">
        <div class="proveedores__campo">
            <label class="proveedores__titulo-texto">Proveedor:</label>
            <!--Este select filtra los productos por proveedor, el value vacío del "Todos"
            hace que productosFiltrados no aplique ningún filtro de proveedor-->
            <select class="proveedores__select" (change)="actualizarProveedor($event)">
                <option value="">Todos</option>
                @for (proveedor of proveedores(); track proveedor.idProveedor) {
                    <option [value]="proveedor.idProveedor">{{ proveedor.nombre }}</option>
                }
            </select>
            <button class="proveedores__boton-nuevo-proveedor" type="button" (click)="clickAgregarProveedor()">Nuevo proveedor</button>
        </div>
        <input class="proveedores__buscador" type="text" placeholder="Buscador..." (input)="actualizarBuscador($event)">
        <button class="proveedores__boton-agregar" type="button" (click)="clickAgregarProducto()">+</button>
    </div>

    <div class="proveedores__grid">
        @for (producto of productosFiltrados(); track producto.idProducto + '_' + producto.idProveedor) {
            <app-producto-proveedor
                [idProducto]="producto.idProducto"
                [idProveedor]="producto.idProveedor"
                [nombre]="producto.nombre"
                [descripcion]="producto.descripcion"
                [precio]="producto.precio"
                [imagenUrl]="producto.imagenUrl"
                (surtir)="surtirProducto($event)"
                (eliminar)="eliminarProductoProveedor($event)">
            </app-producto-proveedor>
        } @empty {
            <!--Igual que en inventario, avisamos al usuario en vez de dejar el grid vacío sin explicación-->
            <p class="proveedores__vacio">No hay productos que coincidan con tu búsqueda.</p>
        }
    </div>
</section>

<!--Modal de Surtir, solo se abre si hay un producto guardado en productoASurtir-->
@if (productoASurtir(); as producto) {
    <app-surtir-producto-proveedor
        [idProducto]="producto.idProducto"
        [idProveedor]="producto.idProveedor"
        [nombre]="producto.nombre"
        [descripcion]="producto.descripcion"
        [precioUnitario]="producto.precio"
        [imagenUrl]="producto.imagenUrl"
        (cerrar)="cerrarModalSurtir()"
        (cancelar)="cerrarModalSurtir()"
        (aceptar)="confirmarSurtido($event)">
    </app-surtir-producto-proveedor>
}

<!--Modal de Agregar Producto, le mandamos la lista completa de proveedores y de productos existentes
para que el usuario pueda elegir asociar el producto nuevo a un proveedor, o elegir uno que ya existe-->
@if (mostrarModalAgregarProducto()) {
    <app-agregar-producto-proveedor
        [proveedores]="proveedores()"
        [productosExistentes]="productos()"
        (cerrar)="cerrarModalProducto()"
        (cancelar)="cerrarModalProducto()"
        (aceptar)="guardarProducto($event)">
    </app-agregar-producto-proveedor>
}

<!--Modal de Agregar Proveedor, este no necesita ningún dato inicial porque siempre es para crear uno nuevo-->
@if (mostrarModalAgregarProveedor()) {
    <app-agregar-proveedor
        (cerrar)="cerrarModalProveedor()"
        (cancelar)="cerrarModalProveedor()"
        (aceptar)="guardarProveedor($event)">
    </app-agregar-proveedor>
}
