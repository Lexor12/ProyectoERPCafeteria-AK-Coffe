<section class="inventario">
    <div class="inventario__toolbar">
        <div class="inventario__titulo">
            <p class="inventario__titulo-texto">Filtro: </p>
        </div>
        <div class="inventario__campo">
            <label class="inventario__etiqueta">Precio Min.</label>
            <input class="inventario__input" type="number" (input)="actualizarPrecioMin($event)">
        </div>
        <div class="inventario__campo">
            <label class="inventario__etiqueta">Precio Máx.</label>
            <input class="inventario__input" type="number" (input)="actualizarPrecioMax($event)">
        </div>
        <input class="inventario__buscador" type="text" placeholder="Buscador..." (input)="actualizarBuscador($event)">
    </div>

    <div class="inventario__grid">
        @for (producto of productosFiltrados(); track producto.idProducto) {
            <app-producto-inventario
                [idProducto]="producto.idProducto"
                [nombre]="producto.nombre"
                [descripcion]="producto.descripcion"
                [precio]="producto.precio"
                [stock]="producto.stock"
                [imagenUrl]="producto.imagenUrl"
                (desactivar)="desactivarProducto($event)"
                (editar)="editarProducto($event)">
            </app-producto-inventario>
        } @empty {
            <!-- En caso de no haber productos por mostrar no vale la pena
            el hecho de mostrar solo el bg sin nada, al mostrar este mensaje
            retroalimentamos al usuario 
            -->
            <p class="inventario__vacio">No hay productos que coincidan con tu búsqueda.</p>
        }
    </div>
</section>
<!--Abrimos el Modal para mostrar el producto que se seleccionó, en caso de que
no haya uno seleccionado el modal no se abrirá-->
@if (productoSeleccionado(); as producto) {
    <app-editar-producto-inventario
        [idProducto]="producto.idProducto"
        [nombreInicial]="producto.nombre"
        [descripcionInicial]="producto.descripcion"
        [precioInicial]="producto.precio"
        [imagenUrlInicial]="producto.imagenUrl"
        (cerrar)="cerrarModal()"
        (cancelar)="cerrarModal()"
        (aceptar)="guardarEdicion($event)">
    </app-editar-producto-inventario>
}
