<!--Esta card sirve para el éxito tras un pago, el título y el texto vienen de signals del componente, 
que arrancan con el mensaje de compra exitosa y se cambian si algo falla al procesar el pago-->
<section class="pago-exitoso">
    <div class="pago-exitoso__description">
        <h2 class="pago-exitoso__title">{{titulo()}}</h2>
        <p class="pago-exitoso__text">{{texto()}}</p>
    </div>
</section>
