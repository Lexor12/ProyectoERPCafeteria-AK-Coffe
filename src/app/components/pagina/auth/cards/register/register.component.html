<div class="card-registro">
    <div class="card-registro__promocion">
        <h2 class="card-registro__promocion-titulo">¿Ya tienes una cuenta?</h2>
        <button class="card-registro__boton-entrar" type="button" (click)="cambiarVista.emit()">Entrar</button>
        <p class="card-registro__promocion-texto">Inicia sesión para continuar disfrutando de tus cafés favoritos de siempre.</p>
    </div>

    <div class="card-registro__divisor"></div>

    <div class="card-registro__formulario">
        <h2 class="card-registro__titulo">Registrarse</h2>
        <form (submit)="registrarCliente($event)">
            <div class="card-registro__campo">
                <label class="card-registro__etiqueta" for="nombre">Nombre:</label>
                <input class="card-registro__input" type="text" id="nombre" (input)="actualizarNombre($event)" placeholder="John Doe" maxlength="50" required>
            </div>
            <div class="card-registro__campo">
                <label class="card-registro__etiqueta" for="apellido">Apellido:</label>
                <input class="card-registro__input" type="text" id="apellido" (input)="actualizarApellido($event)"  placeholder="López Pérez" maxlength="50" required>
            </div>
            <div class="card-registro__campo">
                <label class="card-registro__etiqueta" for="correo">Correo Electrónico:</label>
                <input class="card-registro__input" type="email" id="correo" (input)="actualizarCorreo($event)" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="card-registro__campo">
                <label class="card-registro__etiqueta" for="telefono">Teléfono:</label>
                <input class="card-registro__input" type="tel" id="telefono" (input)="actualizarTelefono($event)" maxlength="10" placeholder="3320394895" required>

            </div>
            <div class="card-registro__campo">
                <label class="card-registro__etiqueta" for="contrasena">Contraseña:</label>
                <input class="card-registro__input" type="password" id="contrasena" (input)="actualizarContrasena($event)" maxlength="64" placeholder="contraseña" required>

            </div>
            <div class="card-registro__campo">
                <label class="card-registro__etiqueta" for="confirmarContrasena">Confirmar Contraseña:</label>
                <input class="card-registro__input" type="password" id="confirmarContrasena" (input)="actualizarContrasenaValidacion($event)" maxlength="64" placeholder="contraseña" required>
            </div>
            <!-- Campo de Términos y Condiciones -->
            <div class="card-registro__campo-terminos">
                <input type="checkbox" id="terminos" (change)="actualizarTerminos($event)" required>
                <label for="terminos" style="font-size: 0.9rem;">
                    He leído y aceptado los <a [routerLink]="['/terminos-y-condiciones']" routerLinkActive="router-link-active">Términos y Condiciones</a> y el <a [routerLink]="['/aviso-de-privacidad']" routerLinkActive="router-link-active">Aviso de Privacidad</a>
                </label>
            </div>
            <button class="card-registro__boton-crear-cuenta" type="submit">Crear Cuenta</button>
            @if (mensajeError()) {
                <p class="card-registro__error">{{ mensajeError() }}</p>
            }
            @if (mensajeExito()) {
                <p class="card-registro__error" style="color: green;">{{ mensajeError() }}</p>
            }
        </form>
    </div>
</div>
